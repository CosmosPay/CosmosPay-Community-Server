# Automatic dependency updates. Dependabot opens weekly PRs to keep dependencies on
# their latest versions and raises security PRs when a fix ships for a known
# vulnerability (respecting the `overrides` in package.json). Every PR runs CI, so
# nothing lands unless the build + tests pass.
version: 2
updates:
  # npm dependencies (incl. transitive fixes / lockfile + overrides bumps).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ['dependencies']
    commit-message:
      prefix: chore # non-feat/fix -> patch bump in the release workflow
    groups:
      # One PR for all non-breaking updates to cut noise; majors stay separate.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Monad contracts' artifacts (src/evm/*.artifact.ts) record the exact solc
      # that compiled them, and every CREATE2 deposit address depends on that
      # bytecode. A newer solc makes the artifact spec fail (source and artifact
      # disagree) and recompiling would be a NEW contract, not an update (see
      # "Monad deposit addresses" in CLAUDE.md). solc moves only by hand, with
      # `npm run contracts:compile`, when no address built from the old bytecode
      # can still hold money.
      - dependency-name: solc

  # Keep the GitHub Actions used by the workflows on their latest versions too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ['ci']
    commit-message:
      prefix: chore
