      order: 0

  # --- the sign-in -------------------------------------------------------------

  - model: authentik_stages_identification.identificationstage
    id: source-email-stage
    identifiers:
      name: cosmos-wallet-source-email
    attrs:
      user_fields: [email]
      case_insensitive_matching: true
      # An unknown address carries on as if it had an account (and is sent to
      # the enrollment), and the page never shows the matched account: the
      # answer is the same either way.
      pretend_user_exists: true
      show_matched_user: false
      password_stage: null
      captcha_stage: null
      webauthn_stage: null
      passwordless_flow: null
      enrollment_flow: null
      recovery_flow: null
      sources: []
      enable_remember_me: false

  - model: authentik_stages_redirect.redirectstage
    id: email-to-enrollment-stage
    identifiers:
      name: cosmos-wallet-email-to-enrollment
    attrs:
      mode: flow
      target_flow: !KeyOf email-enrollment-flow
      keep_context: true

  - model: authentik_stages_email.emailstage
    id: email-sign-in-link-stage
    identifiers:
      name: cosmos-wallet-email-sign-in-link
    attrs:
      use_global_settings: true
      template: email/account_confirmation.html
      subject: !Context email_subject
      token_expiry: minutes=10
      # Never: an account an admin deactivated stays deactivated.
      activate_user_on_success: false

  - model: authentik_flows.flow
    id: source-email-flow
    identifiers:
      slug: wallet-source-email
    attrs:
      name: Cosmos Pay wallet - sign in with email
      title: !Context email_title
      designation: authentication
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf source-email-flow
      stage: !KeyOf source-email-stage
    attrs:
      order: 10

  - model: authentik_flows.flowstagebinding
    id: email-to-enrollment-binding
    identifiers:
      target: !KeyOf source-email-flow
      stage: !KeyOf email-to-enrollment-stage
    attrs:
      order: 20
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-to-enrollment-binding
      policy: !KeyOf email-is-new
    attrs:
      order: 0

  - model: authentik_flows.flowstagebinding
    id: email-sign-in-link-binding
    identifiers:
      target: !KeyOf source-email-flow
      stage: !KeyOf email-sign-in-link-stage
    attrs:
      order: 30
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-sign-in-link-binding
      policy: !KeyOf email-link-ask
    attrs:
      order: 0

  - model: authentik_flows.flowstagebinding
    id: email-sign-in-elsewhere-binding
    identifiers:
      target: !KeyOf source-email-flow
      stage: !KeyOf email-link-elsewhere-stage
    attrs:
      order: 40
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-sign-in-elsewhere-binding
      policy: !KeyOf email-link-proven
    attrs:
      order: 0
      negate: true

  # A second factor, for whoever has one: the default flow's own validation
  # stage, which section 1 sets to skip for everyone else.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf source-email-flow
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
    attrs:
      order: 50
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf source-email-flow
      stage: !KeyOf email-mark-verified-stage
    attrs:
      order: 60
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_flows.flowstagebinding
    id: email-sign-in-login-binding
    identifiers:
      target: !KeyOf source-email-flow
      stage: !KeyOf email-login-stage
    attrs:
      order: 70
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-sign-in-login-binding
      policy: !KeyOf email-link-mark-login
    attrs:
      order: 0

  # --- the wallet's "email" scope: email_verified, and the inbox marker ---------
  # Replaces Authentik's default "email" mapping ON THE WALLET'S PROVIDER (select
  # it there in place of "authentik default OAuth Mapping: OpenID 'email'"):
  # the default answers `email_verified: true` for every user. Only the wallet's
  # provider should carry it; `cosmos_inbox_proven` means something only to the
  # community server.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "Cosmos Wallet: OpenID 'email' (verified only when proven)"
    attrs:
      scope_name: email
      description: Email address, verified only when proven
      expression: |
        # `email_verified` only when an enrollment confirmed the address or the
        # wallet's email link proved it (the `email_verified` attribute), never
        # Authentik's blanket true.
        claims = {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified", False) is True,
        }
        # `cosmos_inbox_proven`: the session this token was issued from logged
        # in through the wallet's emailed link (cosmos-wallet-email-mark-login),
        # for this same address. A ScopeMapping is given the grant as `token`
        # (authentik/providers/oauth2/views/userinfo.py, get_claims), and the
        # grant's session holds its login event — the one Authentik's own `amr`
        # is read from (authentik/providers/oauth2/id_token.py).
        from authentik.events.signals import get_login_event

        grant = request.context.get("token")
        event = get_login_event(getattr(grant, "session", None))
        if event is not None and event.context.get("auth_method") == "email_link":
            args = event.context.get("auth_method_args") or {}
            proven = (args.get("email_link") or {}).get("email") or ""
            address = request.user.email or ""
            if address and proven.lower() == address.lower():
                claims["cosmos_inbox_proven"] = True
        return claims
